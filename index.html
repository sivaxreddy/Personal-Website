<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siva Reddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    /* Space background with stars */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 70%);
    }

    .star {
      position: absolute;
      border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }

    .star.small {
      width: 1px;
      height: 1px;
      background: rgba(255, 255, 255, 0.6);
      animation: twinkle 6s infinite ease-in-out;
    }

    .star.medium {
      width: 2px;
      height: 2px;
      background: rgba(240, 248, 255, 0.7);
      animation: twinkle 4s infinite ease-in-out;
    }

    .star.large {
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 224, 0.8);
      animation: twinkle 3s infinite ease-in-out;
    }

    .star.static {
      animation: none;
      opacity: 0.4;
    }

    .star.distant {
      opacity: 0.3;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }

    /* Floating alien container */
    .alien-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-8px); }
    }

    .alien {
      width: 20vh;
      height: 20vh;
      max-width: 150px;
      max-height: 150px;
      min-width: 100px;
      min-height: 100px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 0 15px rgba(0, 255, 255, 0.3),
        0 0 30px rgba(0, 255, 255, 0.2),
        0 0 45px rgba(0, 255, 255, 0.1),
        inset 0 0 15px rgba(0, 255, 255, 0.05);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), 0 0 30px rgba(0, 255, 255, 0.2), 0 0 45px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(0, 255, 255, 0.05); }
      to { box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), 0 0 40px rgba(0, 255, 255, 0.25), 0 0 60px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.08); }
    }

    .alien img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .alien {
        width: 250px;
        height: 250px;
      }
    }

    @media (max-width: 400px) {
      .alien {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="stars">
    <!-- Generate stars dynamically with JavaScript -->
  </div>

  <div class="alien-container">
    <a href="https://x.com/sivaxreddy" target="_blank" rel="noopener noreferrer">
      <div class="alien">
        <img src="Alien x meta.webp" alt="Alien Baby">
      </div>
    </a>
  </div>

  <script>
    // Create realistic stars
    function createStars() {
      const starsContainer = document.querySelector('.stars');
      const numberOfStars = 200;

      for (let i = 0; i < numberOfStars; i++) {
        const star = document.createElement('div');
        star.className = 'star';

        // Random position
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';

        // Random star type and characteristics
        const starType = Math.random();
        if (starType < 0.6) {
          star.classList.add('small');
        } else if (starType < 0.85) {
          star.classList.add('medium');
        } else {
          star.classList.add('large');
        }

        // Some stars don't twinkle (static)
        if (Math.random() < 0.3) {
          star.classList.add('static');
        }

        // Some stars are more distant (lower opacity)
        if (Math.random() < 0.4) {
          star.classList.add('distant');
        }

        // Random animation delay for twinkling stars
        if (!star.classList.contains('static')) {
          star.style.animationDelay = Math.random() * 8 + 's';
        }

        starsContainer.appendChild(star);
      }
    }

    // Initialize stars when page loads
    createStars();
  </script>
</body>
</html>
